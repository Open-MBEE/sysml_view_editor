name: Bug report
description: Report unexpected behavior with a reproducible example.
body:
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Include the smallest non-sensitive SysML example and steps.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: App revision, browser version, diagnostics and relevant engine profile.
